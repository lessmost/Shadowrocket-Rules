# Generated from Shadowrocket.conf by scripts/build-mihomo-config.rb. Do not edit by hand.
# Before importing into Clash Verge Rev, replace proxy-providers.my-subscription.url
# with your own subscription URL. README.md lists the differences from Shadowrocket.
# Not converted (no Mihomo equivalent): URL Rewrite, MITM.

mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: false
proxy-providers:
  my-subscription:
    type: http
    url: https://your-subscription-url.example/replace-me
    path: "./proxy-providers/my-subscription.yaml"
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
    override:
      udp: true
proxy-groups:
- name: PROXY
  type: select
  use:
  - my-subscription
- name: "🚀 节点选择"
  type: select
  proxies:
  - PROXY
  - DIRECT
  - REJECT
  - "🇭🇰 香港节点"
  - "🇹🇼 台湾节点"
  - "🇯🇵 日本节点"
  - "🇸🇬 新加坡节点"
  - "🇺🇸 美国节点"
  - "🌐 其他节点"
- name: "🇭🇰 香港节点"
  type: url-test
  use:
  - my-subscription
  filter: "🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港"
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 0
  timeout: 5000
  empty-fallback: REJECT
- name: "🇹🇼 台湾节点"
  type: url-test
  use:
  - my-subscription
  filter: "🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化"
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 0
  timeout: 5000
  empty-fallback: REJECT
- name: "🇯🇵 日本节点"
  type: url-test
  use:
  - my-subscription
  filter: "🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪"
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 0
  timeout: 5000
  empty-fallback: REJECT
- name: "🇸🇬 新加坡节点"
  type: url-test
  use:
  - my-subscription
  filter: "🇸🇬|SG|Singapore|singapore|新加坡"
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 0
  timeout: 5000
  empty-fallback: REJECT
- name: "🇺🇸 美国节点"
  type: url-test
  use:
  - my-subscription
  filter: "🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美"
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 0
  timeout: 5000
  empty-fallback: REJECT
- name: "🌐 其他节点"
  type: url-test
  use:
  - my-subscription
  filter: "^((?!(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化|🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|🇸🇬|SG|Singapore|singapore|新加坡|🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美)).)*$"
  url: http://www.gstatic.com/generate_204
  interval: 600
  tolerance: 0
  timeout: 5000
  empty-fallback: REJECT
- name: "🧱 DNS 防泄露"
  type: select
  proxies:
  - REJECT
  - "🚀 节点选择"
  - DIRECT
- name: "🤖 AI 服务"
  type: select
  proxies:
  - "🇺🇸 美国节点"
  - "🚀 节点选择"
  - PROXY
