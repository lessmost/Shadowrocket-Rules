dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - localhost
  - localhost.weixin.qq.com
  - "+.local"
  - "+.in-addr.arpa"
  - "+.ip6.arpa"
  - captive.apple.com
  - "+.icloud.com"
  - "+.icloud-content.com"
  - "+.apple-cloudkit.com"
  - "+.cdn-apple.com"
  - "+.mzstatic.com"
  - "+.ccb.com"
  - "+.abchina.com.cn"
  - "+.psbc.com"
  - "+.bilibili.com"
  - "+.bilivideo.com"
  - "+.bilivideo.cn"
  - "+.hdslb.com"
  - "+.biliapi.net"
  - "+.biliapi.com"
  - "+.szbdyd.com"
  - "+.ourdvsss.com"
  - httpdns.bilivideo.com
  - "+._dns-sd._udp.0.55.211.10.in-addr.arpa"
  - "+._dns-sd._udp.0.97.168.192.in-addr.arpa"
  - "+._dns-sd._udp.0.129.37.10.in-addr.arpa"
  - "+._dns-sd._udp.0.138.168.192.in-addr.arpa"
  - "+._dns-sd._udp.0.168.168.192.in-addr.arpa"
  - "+.ksyungslb.com"
  - "+.00cdn.com"
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
  - system
  proxy-server-nameserver:
  - system
  nameserver:
  - https://cloudflare-dns.com/dns-query#PROXY
  - https://dns.google/dns-query#PROXY
  direct-nameserver:
  - system
  nameserver-policy:
    "+._dns-sd._udp.0.55.211.10.in-addr.arpa": system
    "+._dns-sd._udp.0.97.168.192.in-addr.arpa": system
    "+._dns-sd._udp.0.129.37.10.in-addr.arpa": system
    "+._dns-sd._udp.0.138.168.192.in-addr.arpa": system
    "+._dns-sd._udp.0.168.168.192.in-addr.arpa": system
    "+.in-addr.arpa": system
    "+.ip6.arpa": system
    "+.local": system
    "+.apple-cloudkit.com": system
    "+.cdn-apple.com": system
    "+.icloud.com": system
    "+.icloud-content.com": system
    "+.mzstatic.com": system
    "+.bilibili.com": system
    "+.bilivideo.com": system
    "+.bilivideo.cn": system
    "+.hdslb.com": system
    "+.biliapi.net": system
    "+.biliapi.com": system
    "+.szbdyd.com": system
    "+.ourdvsss.com": system
    "+.ksyungslb.com": system
    "+.00cdn.com": system
    httpdns.bilivideo.com: system
hosts:
  localhost.weixin.qq.com: 127.0.0.1
  localhost: 127.0.0.1
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
tun:
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
  route-exclude-address:
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 255.255.255.255/32
  - 239.255.255.250/32
