  - PROXY
  - DIRECT
  - REJECT
- name: "🐱 代码托管"
  type: select
  proxies:
  - "🚀 节点选择"
  - PROXY
  - DIRECT
  - REJECT
- name: "🏦 汇丰香港"
  type: select
  proxies:
  - "🇭🇰 香港节点"
  - DIRECT
  - "🚀 节点选择"
  - PROXY
